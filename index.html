<style>

/* Layout: same system as the Elegancia app — a 460px phone column on a grey frame, navy header band,
   white rounded cards, bottom tabs, floating "+ Cita", forms in a bottom sheet. Single light theme on purpose. */
:root{
  --frame:#CDD6DB; --bg:#F4F2EE; --surface:#FFFFFF; --ink:#1B2838; --muted:#64748B; --soft:#94A3B8; --line:#E2E8F0;
  --primary:#1F6E8C; --primary-dark:#163A4A; --cream:#F4EFE4; --accent:#A97C22; --blue-bg:#E3EEF2;
  --red:#D64545; --red-bg:#FBE7E6; --yellow:#B97F12; --yellow-bg:#FBF0DA; --green:#3E9960; --green-bg:#E4F4EA;
  --purple:#8E55B8; --purple-bg:#F1E6F8; --teal:#1F8F82; --teal-bg:#DDF2EF; --scrim:rgba(13,20,30,.5);
  --display:"Poppins", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --script:"Kaushan Script", "Brush Script MT", cursive;
  --body:"Poppins", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--frame)}
body{color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--primary-dark)}
h1,h2,h3{margin:0;text-wrap:balance;color:var(--primary-dark)}
h1{font-family:var(--display);font-size:1.5rem;font-weight:700;line-height:1.15;letter-spacing:-.01em}
h2{font-family:var(--display);font-size:1.08rem;font-weight:700;line-height:1.2}
h3{font-size:.98rem;font-weight:600}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:120px}
.hdr{background:var(--primary-dark);color:var(--cream)}
.hdr-in{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:16px 18px;display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:50%;flex:none;display:block}
.hdr b{font-family:var(--script);font-size:1.45rem;font-weight:400;display:block;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr small{display:block;font-size:.72rem;color:#C9D3DF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 8px;display:flex;flex-direction:column;gap:14px}
.sub{color:var(--muted);font-size:.82rem}
.lbl{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--soft)}
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:.84rem;padding:4px 0}
.week{display:grid;grid-template-columns:28px repeat(7,minmax(0,1fr)) 28px;gap:3px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 4px}
.arrow{border:0;background:none;color:var(--soft);height:44px;font-size:1.3rem}
.day{display:flex;flex-direction:column;align-items:center;padding:6px 0 5px;border-radius:12px;border:0;background:none;min-width:0}
.day small{font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);font-weight:600}
.day b{font-size:1rem;font-weight:600;font-variant-numeric:tabular-nums}
.day i{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:2px;opacity:0}
.day.has i{opacity:1}
.day.today b{color:var(--accent)}
.day.sel{background:var(--primary);color:#fff}
.day.sel small,.day.sel b{color:inherit}
.day.sel i{background:var(--cream)}
.summary{background:var(--primary-dark);border-radius:16px;padding:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.summary div{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 10px;min-width:0}
.summary span{display:block;font-size:.68rem;color:#C9D3DF;font-weight:500}
.summary b{display:block;color:#fff;font-weight:600;font-size:1.02rem;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary .warn b{color:#FCD58A}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 1px 0 rgba(15,22,38,.05)}
.cita{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px}
.cita.off{opacity:.55}
.time{font-weight:600;font-size:1.05rem;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--primary)}
.time small{display:block;color:var(--soft);font-weight:500;font-size:.72rem}
.body{display:flex;flex-direction:column;gap:5px;min-width:0}
.row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.row1 h3{min-width:0}
.who{color:var(--muted);font-size:.8rem}
.raza{font-weight:600;font-size:.84rem;color:var(--accent);margin-top:-3px}
.cita.mine{border-color:var(--teal);box-shadow:inset 3px 0 0 var(--teal)}
.rpick{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;max-height:232px;overflow-y:auto}
.rpick button{border:0;border-top:1px solid var(--line);background:var(--surface);text-align:left;padding:10px 12px;font-size:.88rem}
.rpick button:first-child{border-top:0}
.rpick button.on{background:var(--primary);color:#fff;font-weight:600}
.rpick .none{padding:10px 12px;font-size:.82rem;color:var(--muted)}
.svs{font-weight:500;font-size:.88rem}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.price{font-variant-numeric:tabular-nums;font-weight:600}
.note{font-size:.8rem;color:var(--muted);background:var(--bg);border-radius:10px;padding:6px 9px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--blue-bg);color:var(--primary);white-space:nowrap}
.tag.red{background:var(--red-bg);color:var(--red)} .tag.yellow{background:var(--yellow-bg);color:var(--yellow)}
.tag.green{background:var(--green-bg);color:var(--green)} .tag.purple{background:var(--purple-bg);color:var(--purple)}
.tag.teal{background:var(--teal-bg);color:var(--teal)} .tag.brown{background:var(--cream);color:var(--accent)}
.pill{border:0;border-radius:99px;font-size:.72rem;font-weight:600;padding:6px 12px;white-space:nowrap;flex:none}
.st-pendiente{background:var(--blue-bg);color:var(--muted)}
.st-confirmada{background:var(--teal-bg);color:var(--teal)}
.st-realizada{background:var(--green-bg);color:var(--green)}
.st-cancelada{background:var(--red-bg);color:var(--red)}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
.btn{font-weight:600;font-size:.84rem;border-radius:12px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);color:var(--primary);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.primary{background:var(--primary);color:#fff;border-color:transparent}
.btn.wa{background:var(--green-bg);color:var(--green);border-color:transparent}
.btn.danger{color:var(--red)}
.btn.armed{background:var(--red);color:#fff;border-color:transparent}
.btn.full{width:100%;min-height:46px;font-size:.9rem}
.empty{text-align:center;padding:26px 16px;border:1.5px dashed #CBD5E1;border-radius:16px;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--surface)}
.empty b{color:var(--primary-dark);font-size:1.02rem}
.ritem{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ritem>div{min-width:0}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--cream);border-radius:14px;padding:10px 12px;font-size:.82rem}
.banner b{color:var(--accent)}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;font-size:15px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.78rem;font-weight:600;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:transparent}
.clicard{width:100%;text-align:left;display:flex;flex-direction:column;gap:6px}
.clicard .l1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.clicard .l1 b{font-weight:600;font-size:.95rem}
.petline{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.85rem;font-weight:500}
.field{display:flex;flex-direction:column;gap:6px;border:0;padding:0;margin:0;min-width:0}
.field>label,.field>legend{font-size:.78rem;font-weight:600;color:var(--primary-dark);padding:0}
.field>legend{margin-bottom:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.inline{display:flex;gap:8px}
.inline select{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input,.seg input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-block;padding:7px 12px;border-radius:99px;border:1px solid var(--line);font-weight:500;font-size:.82rem;background:var(--surface)}
.chip input:checked+span{background:var(--primary);color:#fff;border-color:transparent}
.chip.warn input:checked+span{background:var(--red);}
.chip input:focus-visible+span,.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--blue-bg);padding:3px;border-radius:12px;gap:3px}
.seg label{position:relative}
.seg span{display:block;text-align:center;padding:8px 6px;border-radius:9px;font-weight:600;font-size:.82rem;color:var(--muted)}
.seg input:checked+span{background:var(--surface);color:var(--primary-dark);box-shadow:0 1px 2px rgba(15,22,38,.12)}
.hint{font-size:.78rem;color:var(--muted)}
.formact{display:flex;justify-content:space-between;gap:10px;padding-top:4px}
.formact .primary{margin-left:auto}
.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;position:relative;padding-bottom:12px}
.stop:not(:last-child)::before{content:"";position:absolute;left:15px;top:32px;bottom:0;border-left:2px dashed #CBD5E1}
.num{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:600}
.stop.done .num{background:var(--green)}
.stop .card{display:flex;flex-direction:column;gap:5px;padding:12px}
.dir{font-weight:500;font-size:.86rem}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px}
th{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--soft);text-align:left;padding:4px;font-weight:600}
td{padding:3px}
td input{padding:8px;font-size:15px;font-variant-numeric:tabular-nums}
td.n input{width:76px}
.x{background:none;border:0;color:var(--soft);font-weight:600;padding:6px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
.tabs-in{pointer-events:auto;width:100%;max-width:460px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{border:0;background:none;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;font-size:.74rem;font-weight:600}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--primary)}
.fab{position:fixed;z-index:25;right:max(16px,env(safe-area-inset-right,0px),calc(50% - 214px));bottom:calc(76px + env(safe-area-inset-bottom,0px));border:0;border-radius:16px;background:var(--accent);color:#fff;font-weight:600;padding:13px 18px;box-shadow:0 8px 20px rgba(27,40,56,.3)}
#sheet{position:fixed;inset:0;z-index:50}
.backdrop{position:absolute;inset:0;background:var(--scrim)}
.panel{position:absolute;left:0;right:0;bottom:0;margin-inline:auto;max-width:460px;max-height:90%;overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:14px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.panel form{display:flex;flex-direction:column;gap:14px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-14px;background:var(--surface);padding-block:6px;z-index:1}
.kv{display:flex;flex-direction:column;gap:2px;font-size:.86rem}
.pet{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.hist{display:flex;flex-direction:column}
.hist>div{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:.82rem;align-items:baseline}
.hist .d{color:var(--soft);font-variant-numeric:tabular-nums;font-weight:600}
.msgbox{white-space:pre-wrap}
.tplvars{display:flex;flex-wrap:wrap;gap:4px}
.tplvars code{font-size:.7rem;background:var(--blue-bg);color:var(--primary);border-radius:6px;padding:1px 6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--primary-dark);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:.84rem;max-width:calc(100% - 32px)}
.whochip{border:0;background:rgba(255,255,255,.14);color:var(--cream)!important;color:var(--primary-dark);border-radius:99px;font-size:.7rem;font-weight:600;padding:6px 10px;white-space:nowrap;max-width:9rem;overflow:hidden;text-overflow:ellipsis;flex:none}
.gear{border:0;background:rgba(255,255,255,.1);color:var(--cream);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.gear[aria-current="page"]{background:var(--cream);color:var(--primary-dark)}
.lockbox{align-items:center;text-align:center;padding:22px 18px}
.lockbox form{width:100%;max-width:260px}
.lockico{width:52px;height:52px;border-radius:50%;background:var(--cream);color:var(--accent);display:grid;place-items:center}
.pin{text-align:center;font-size:1.5rem;letter-spacing:.4em;font-variant-numeric:tabular-nums}
.team{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.member{display:flex;align-items:center;gap:10px;text-align:left;position:relative;min-width:0}
.member>span:nth-child(2){display:flex;flex-direction:column;min-width:0}
.member b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.dot{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--green)}
.shift{display:flex;flex-direction:column;gap:2px;background:var(--bg);border-radius:12px;padding:10px 12px}
.shift.on{background:var(--teal-bg)}.shift.on b{color:var(--teal)}
.btn.big{min-height:56px;font-size:1rem}
.total{font-size:1.8rem;font-weight:700;color:var(--primary-dark);line-height:1}
.summary.fin .pos b{color:#86EFAC}.summary.fin .neg b{color:#FCA5A5}
.brow{display:grid;grid-template-columns:minmax(0,7.5rem) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.84rem}
.brow>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:99px;background:var(--blue-bg);overflow:hidden}.bar i{display:block;height:100%;background:var(--primary);border-radius:99px}.bar.red i{background:var(--accent)}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.8rem;padding:4px 0}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}

body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
.hdr-in{padding-top:max(16px,calc(env(safe-area-inset-top,0px) + 8px))}
body::before{display:none}
.tabs-in{padding-bottom:max(4px,env(safe-area-inset-bottom,0px))}
.banner.err{background:var(--red-bg)}.banner.err b{color:var(--red)}
#auth{min-height:100vh;min-height:100dvh;background:var(--primary-dark);display:flex;align-items:flex-start;justify-content:center;padding:max(28px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
.auth-box{width:100%;max-width:400px;background:var(--surface);border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;margin-top:4vh}
.auth-logo{width:120px;height:120px;align-self:center;margin-top:-4px}
.auth-name{font-family:var(--script);font-weight:400;font-size:2rem;text-align:center;color:var(--primary-dark)}
.auth-msg{color:var(--red);font-size:.84rem;margin:0}.auth-msg:empty{display:none}.auth-msg.ok{color:var(--green)}
.auth-links{display:flex;flex-direction:column;align-items:center;gap:4px}
.auth-foot{text-align:center;margin-top:6px}
#lic{position:fixed;inset:0;z-index:80;background:var(--primary-dark);overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.lic-wrap{max-width:400px;margin:0 auto;display:flex;flex-direction:column;gap:12px;align-items:center}
.lic-logo{width:96px;height:96px}
.lic-card{background:var(--surface);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;width:100%}
.lic-card .lockico{align-self:center}.lic-card h2{text-align:center}
.lic-row{display:flex;flex-direction:column;gap:2px}
.lic-big{font-size:1.7rem;font-weight:700;color:var(--primary-dark);font-variant-numeric:tabular-nums}
.lockico{width:52px;height:52px;border-radius:50%;background:var(--cream);color:var(--accent);display:grid;place-items:center}

.tip{background:var(--blue-bg);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tip b{color:var(--primary-dark)}
.tip ol{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:4px;font-size:.86rem}
.tip .x{font-size:.74rem;color:var(--primary)}
details.acc{padding:0}
details.acc>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary>*{flex:1;min-width:0}
details.acc>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--soft);border-bottom:2px solid var(--soft);transform:rotate(45deg);margin-top:-4px;flex:none;transition:transform .15s}
details.acc[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
details.acc>.list{padding:0 14px 14px}

.calseg{display:grid;grid-template-columns:1fr 1fr;background:var(--blue-bg);padding:3px;border-radius:12px;gap:3px}
.calseg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:600;font-size:.84rem;color:var(--muted);min-height:40px}

const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const TODAY=iso(new Date());
const money=n=>'₡'+Math.round(+n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hhmm=h=>{const[a,b]=h.split(':').map(Number);return `${a%12||12}:${pad(b)}`};
const ampm=h=>(+h.split(':')[0]<12?'a. m.':'p. m.');
const fmt12=h=>`${hhmm(h)} ${ampm(h)}`;
const longDate=s=>{const t=parse(s).toLocaleDateString('es-CR',{weekday:'long',day:'numeric',month:'long'});return t.charAt(0).toUpperCase()+t.slice(1)};
const shortDate=s=>parse(s).toLocaleDateString('es-CR',{day:'numeric',month:'short'}).replace('.','');
const first=n=>(n||'').trim().split(' ')[0];
const fill=(t,v)=>t.replace(/\{(\w+)\}/g,(m,k)=>v[k]!==undefined?v[k]:m);

function calc(st,c){
  const cl=st.clientes.find(x=>x.id===c.cli),m=cl?.mascotas.find(x=>x.id===c.m);
  const si=Math.max(0,SIZES.indexOf(m?.tam||'M'));
  let t=st.servicios.filter(s=>c.sv.includes(s.id)).reduce((a,s)=>a+(+s.p[si]||0),0);
  if(c.tipo==='domicilio'&&!c.junto){const z=st.zonas.find(z=>z.id===cl?.zona);t+=tieneTP(c)?+c.transP:+(z?.recargo||0)}
  t+=+(c.pastillaP||0);
  return t;
}
function pet(o){return Object.assign({especie:'Perro',sexo:'Macho',etapa:'Adulto',raza:'',tam:'M',temp:'Tranquilo',comp:'promedio',muerde:false,castrado:false,frec:30,notas:''},o)}

    servicios:[{id:'s1',nombre:'Baño premium',p:[0,0,0,0],min:60},{id:'s2',nombre:'Baño y corte',p:[0,0,0,0],min:120},{id:'s3',nombre:'Deslanado',p:[0,0,0,0],min:60}],

const waHref=(tel,txt)=>`https://wa.me/${digits(tel)}?text=${encodeURIComponent(txt)}`;
const waLink=(tel,txt,label='WhatsApp')=>digits(tel)?`<a class="btn wa" href="${waHref(tel,txt)}" target="_blank" rel="noopener">${label}</a>`:'';
const addrQ=cl=>[cl.dir,zonaOf(cl.zona)?.nombre,'Costa Rica'].filter(Boolean).join(', ');
const mapUrl=cl=>cl?.ubic?cl.ubic:(cl?.dir?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addrQ(cl))}`:'');
const mapLink=cl=>mapUrl(cl)?`<a class="btn" href="${esc(mapUrl(cl))}" target="_blank" rel="noopener">Ubicación</a>`:'';

function lastDone(mid){return S.citas.filter(c=>c.m===mid&&c.estado==='realizada').map(c=>c.fecha).sort().pop()}
function nextBath(m){const l=lastDone(m.id);return l?addDays(l,+m.frec||30):null}
function hasFuture(mid){return S.citas.some(c=>c.m===mid&&c.fecha>=TODAY&&(c.estado==='pendiente'||c.estado==='confirmada'))}
function petStatus(m){const d=nextBath(m);if(!d)return 'sin';if(hasFuture(m.id))return 'aldia';const dd=diffDays(d,TODAY);return dd<0?'atrasado':dd<=7?'revisar':'aldia'}
const ST_CLI={atrasado:['Atrasado','red'],revisar:['Le toca pronto','yellow'],aldia:['Al día','green'],sin:['Sin visitas','']};
function dueText(dd){return dd<0?`Atrasado ${-dd} día${dd===-1?'':'s'}`:dd===0?'Le toca hoy':`En ${dd} día${dd===1?'':'s'}`}
function tiempoTxt(d){return d<60?`${Math.max(1,Math.floor(d/7))} semanas`:`${Math.floor(d/30)} meses`}

function razaLine(m){if(!m)return'';
  return `<p class="raza">${m.raza?esc(m.raza):'<span class="tag yellow">Raza sin anotar</span>'} <span class="sub">· ${SIZE_N[m.tam]}${+m.peso?` · ${m.peso} kg`:''}</span></p>`}
function petTags(m,full){
  if(!m)return'';const t=[];const cp=COMP.find(x=>x[0]===m.comp);
  if(cp)t.push(`<span class="tag ${cp[2]}">${cp[1]}</span>`);
  if(m.muerde)t.push('<span class="tag red">Muerde</span>');
  if(full||m.temp!=='Tranquilo')t.push(`<span class="tag ${m.temp==='Agresivo'?'red':m.temp==='Tranquilo'?'':'yellow'}">${esc(m.temp)}</span>`);
  if(full){t.push(`<span class="tag">${esc(m.especie)} · ${esc(m.sexo)}</span>`,`<span class="tag">${esc(m.etapa)}</span>`);
    t.push(`<span class="tag ${m.castrado?'':'purple'}">${m.castrado?(m.sexo==='Hembra'?'Castrada':'Castrado'):'Sin castrar'}</span>`)}
  return `<div class="tags">${t.join('')}</div>`;
}

/* ---------- vistas ---------- */
function week(){
  const dow=(parse(sel).getDay()+6)%7,mon=addDays(sel,-dow),L=['L','K','M','J','V','S','D'];
  let h=`<div class="week"><button class="arrow" data-act="wk" data-n="-7" aria-label="Semana anterior">‹</button>`;
  for(let i=0;i<7;i++){const d=addDays(mon,i),has=S.citas.some(c=>c.fecha===d&&c.estado!=='cancelada'&&(view!=='ruta'||c.tipo==='domicilio'));
    h+=`<button class="day${d===sel?' sel':''}${d===TODAY?' today':''}${has?' has':''}" data-act="day" data-d="${d}" aria-label="${longDate(d)}"><small>${L[i]}</small><b>${parse(d).getDate()}</b><i></i></button>`}
  return h+`<button class="arrow" data-act="wk" data-n="7" aria-label="Semana siguiente">›</button></div>`;
}
let calMode='semana';try{calMode=localStorage.getItem('cal-mode')||'semana'}catch(e){}
function calendario(){return `<div class="seg calseg" role="group" aria-label="Ver por">${[['semana','Semana'],['mes','Mes']].map(([k,l])=>`<button type="button" data-act="calmode" data-m="${k}" aria-pressed="${calMode===k}">${l}</button>`).join('')}</div>${calMode==='mes'?monthCal():week()}`}
function monthCal(){const d=parse(sel),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),start=addDays(iso(first),-((first.getDay()+6)%7));
  const cnt={};S.citas.forEach(c=>{if(c.estado!=='cancelada')cnt[c.fecha]=(cnt[c.fecha]||0)+1});
  const tot=Object.entries(cnt).filter(([f])=>{const x=parse(f);return x.getMonth()===m&&x.getFullYear()===y}).reduce((a,[,n])=>a+n,0);
  const max=Math.max(1,...Object.values(cnt));
  const mes=first.toLocaleDateString('es-CR',{month:'long',year:'numeric'});
  let h=`<div class="month"><div class="mhead"><button class="arrow" data-act="mon" data-n="-1" aria-label="Mes anterior">‹</button><div><b>${mes.charAt(0).toUpperCase()+mes.slice(1)}</b><span class="sub">${tot} cita${tot===1?'':'s'} en el mes</span></div><button class="arrow" data-act="mon" data-n="1" aria-label="Mes siguiente">›</button></div><div class="mgrid">${['L','K','M','J','V','S','D'].map(x=>`<span class="mdow">${x}</span>`).join('')}`;
  for(let i=0;i<42;i++){const f=addDays(start,i),pd=parse(f);if(i>=35&&pd.getMonth()!==m)break;const n=cnt[f]||0;
    h+=`<button class="mday${pd.getMonth()!==m?' out':''}${f===sel?' sel':''}${f===TODAY?' today':''}" data-act="day" data-d="${f}" aria-label="${longDate(f)}${n?`, ${n} cita${n===1?'':'s'}`:''}"><b>${pd.getDate()}</b>${n?`<i style="--a:${.25+.75*n/max}">${n}</i>`:'<i class="none"></i>'}</button>`}
  return h+'</div></div>'}
function dayHead(title){return `<div class="dayhead"><div><span class="lbl">${sel===TODAY?'Hoy':'Día elegido'}</span><h1>${title}</h1><p class="sub">${longDate(sel)}</p></div>${sel!==TODAY?`<button class="linkbtn" data-act="day" data-d="${TODAY}">Ir a hoy</button>`:''}</div>`}
function demoBanner(){return syncBanner()}

/* ---------- factura electrónica ---------- */
const TIPOS_ID={fisica:'Cédula física',juridica:'Cédula jurídica',dimex:'DIMEX',nite:'NITE',extranjero:'Pasaporte / extranjero'};
const PROVINCIAS=['San José','Alajuela','Cartago','Heredia','Guanacaste','Puntarenas','Limón'];
const LARGO_ID={fisica:[9],juridica:[10],dimex:[11,12],nite:[10]};
const onlyDig=t=>(t||'').replace(/\D/g,'');
function idProblem(tipo,num){const d=onlyDig(num);if(!d)return 'Falta el número de identificación.';
  const L=LARGO_ID[tipo];if(L&&!L.includes(d.length))return `${TIPOS_ID[tipo]} lleva ${L.join(' u ')} dígitos y tiene ${d.length}.`;
  if(tipo==='fisica'&&d[0]==='0')return 'La cédula física no empieza con 0. Ejemplo: 2-0555-0777 se escribe 205550777.';return ''}
function fmtId(tipo,num){const d=onlyDig(num);if(tipo==='fisica'&&d.length===9)return `${d[0]}-${d.slice(1,5)}-${d.slice(5)}`;if(tipo==='juridica'&&d.length===10)return `${d[0]}-${d.slice(1,4)}-${d.slice(4)}`;return num||''}
const mailOk=t=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(t||'');
function feFaltan(fe){const f=[];if(!fe?.nombre)f.push('nombre');const p=idProblem(fe?.tipo,fe?.num);if(p)f.push('identificación');if(!mailOk(fe?.correo))f.push('correo');return f}
function lineas(c){const cl=cliOf(c.cli),m=petOf(c.cli,c.m),si=Math.max(0,SIZES.indexOf(m?.tam||'M'));
  const L=S.servicios.filter(s=>c.sv.includes(s.id)).map(s=>[`${s.nombre} (${m?.nombre||'mascota'}, ${SIZE_N[m?.tam||'M'].toLowerCase()})`,+s.p[si]||0]);
  if(+c.pastillaP)L.push([`Pastilla (${pastNombre(c.pastilla)})`,+c.pastillaP]);
  if(c.tipo==='domicilio'&&!c.junto){const z=zonaOf(cl?.zona),tp=tieneTP(c)?+c.transP:+(z?.recargo||0);if(tp)L.push([`Transporte: recoger y entregar la mascota${z?` (${z.nombre})`:''}`,tp])}
  const sum=L.reduce((a,l)=>a+l[1],0);if(sum!==+c.precio)L.push([+c.precio>sum?'Ajuste de precio':'Descuento',(+c.precio||0)-sum]);
  return L}
function textoFactura(c){const cl=cliOf(c.cli),fe=cl?.fe||{};
  const ub=[fe.prov,fe.canton,fe.distrito].filter(Boolean).join(', ');
  return ['DATOS PARA FACTURA ELECTRÓNICA','',
    `Receptor: ${fe.nombre||cl?.nombre||''}`,`${TIPOS_ID[fe.tipo]||'Identificación'}: ${fmtId(fe.tipo,fe.num||cl?.ced)||'—'}`,`Correo para la factura: ${fe.correo||'—'}`,`Teléfono: ${cl?.tel||'—'}`,
    fe.actividad?`Actividad económica: ${fe.actividad}`:null,ub?`Ubicación: ${ub}`:null,'',
    `Fecha del servicio: ${longDate(c.fecha)}`,'Detalle:',...lineas(c).map(([d,v])=>`• ${d}: ${money(v)}`),`Total: ${money(c.precio)}`,
    `Método de pago: ${c.metodo||'—'}${c.pago==='pagado'?' (pagado)':' (pendiente de pago)'}`,
    ...(S.negocio.feNum?['',`Emisor: ${S.negocio.feNombre||S.negocio.nombre} · ${TIPOS_ID[S.negocio.feTipo]||''} ${fmtId(S.negocio.feTipo,S.negocio.feNum)}${S.negocio.feActividad?' · Actividad '+S.negocio.feActividad:''}`]:[])].filter(x=>x!==null).join('\n')}
const factTag=c=>c.estado!=='realizada'||!c.fact||c.fact==='no'?'':c.fact==='emitida'?'<span class="tag green">Factura ✓</span>':'<span class="tag purple">Factura por emitir</span>';
function facturasPend(){
  const L=S.citas.filter(c=>c.estado==='realizada'&&c.fact==='pendiente').sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(!L.length)return'';
  return `<section class="list"><div><h2>Facturas por emitir</h2><p class="sub">Servicios realizados de clientes que pidieron factura electrónica.</p></div>${L.map(c=>{const cl=cliOf(c.cli),m=petOf(c.cli,c.m),fl=feFaltan(feDe(cl));
    return `<div class="card ritem"><div><b>${esc(cl?.fe?.nombre||cl?.nombre||'')}</b><br><span class="sub">${shortDate(c.fecha)} · ${esc(m?.nombre||'')} · ${money(c.precio)}</span>${fl.length?`<div class="tags" style="margin-top:4px"><span class="tag red">Falta ${fl.join(', ')}</span></div>`:''}</div><div class="actions"><button class="btn primary" data-act="factura" data-id="${c.id}">Ver datos</button></div></div>`}).join('')}</section>`;
}
function openFactura(id){
  const c=S.citas.find(x=>x.id===id),cl=cliOf(c.cli),fl=feFaltan(feDe(cl));
  openSheet(`<form data-form="fact" data-id="${id}">${head('Factura electrónica',`${esc(cl?.nombre||'')} · ${shortDate(c.fecha)}`)}
  ${!cl?.fe?.on?`<div class="banner"><span>Este cliente no tiene datos de factura.</span><button type="button" class="btn" data-act="edit-cli" data-id="${cl.id}">Agregar datos</button></div>`:fl.length?`<div class="banner"><span><b>Falta:</b> ${fl.join(', ')}.</span><button type="button" class="btn" data-act="edit-cli" data-id="${cl.id}">Completar</button></div>`:''}
  <textarea id="fx-txt" class="msgbox" rows="15" aria-label="Datos para la factura" readonly>${esc(textoFactura(c))}</textarea>
  <button type="button" class="btn full" data-act="copy" data-src="fx-txt">Copiar datos para facturar</button>
  <fieldset class="field"><legend>Estado de la factura</legend><div class="seg">${radios('fact',[['no','No lleva'],['pendiente','Por emitir'],['emitida','Emitida']],c.fact||'pendiente','')}</div></fieldset>
  <div class="field"><label for="fx-num">N.º de consecutivo o clave (opcional)</label><input id="fx-num" name="factNum" inputmode="numeric" placeholder="Ej.: 00100001010000000123" value="${esc(c.factNum||'')}"></div>
  <button class="btn primary full" type="submit">Guardar</button></form>`);
}

function nextStep(c){const cl=cliOf(c.cli),m=petOf(c.cli,c.m);

const toMin=h=>{const[a,b]=h.split(':').map(Number);return a*60+b},toHM=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
function durSvc(sv){if(+sv?.min)return +sv.min;const n=(sv?.nombre||'').toLowerCase();return /corte/.test(n)&&!/uñas|unas/.test(n)?120:/baño|bano|deslan/.test(n)?60:/uñas|unas|oído|oido/.test(n)?15:30}
function citaDur(c){const t=c.sv.reduce((a,sid)=>a+durSvc(servOf(sid)),0);return Math.max(30,Math.ceil(t/30)*30)}

function ocupadas(fecha,selfId){return S.citas.filter(c=>c.fecha===fecha&&c.estado!=='cancelada'&&c.id!==selfId)}
function enUso(fecha,h,selfId){const t=toMin(h);return ocupadas(fecha,selfId).filter(c=>toMin(c.hora)<=t&&t<citaFin(c))}
function slotList(){const [ih,im]=S.negocio.inicio.split(':').map(Number),[fh,fm]=S.negocio.fin.split(':').map(Number),o=[];for(let t=ih*60+im;t<=fh*60+fm;t+=30)o.push(`${pad(Math.floor(t/60))}:${pad(t%60)}`);return o}
function slots(fecha,cur,selfId){
  const out=slotList();if(cur&&!out.includes(cur))out.push(cur);out.sort();
  return out.map(h=>{const u=enUso(fecha,h,selfId);return `<option value="${h}" ${h===cur?'selected':''}>${fmt12(h)}${u.length?` · ocupado (${u.map(c=>petOf(c.cli,c.m)?.nombre||'cita').join(', ')})`:' · libre'}</option>`}).join('');
}
function firstFree(fecha){return slotList().find(h=>!enUso(fecha,h).length)||S.negocio.inicio}
function timeline(fecha){
  const cs=ocupadas(fecha).sort(byHora),all=S.citas.filter(c=>c.fecha===fecha&&c.estado==='cancelada');
  let ini=toMin(S.negocio.inicio),fin=toMin(S.negocio.fin)+30;
  cs.forEach(c=>{ini=Math.min(ini,toMin(c.hora));fin=Math.max(fin,citaFin(c))});
  const out=[];let t=ini,libreDesde=null;
  const cierraLibre=hasta=>{if(libreDesde!==null){out.push(`<button class="slot free" data-act="new-cita-at" data-h="${toHM(libreDesde)}"><span><b>Libre</b> ${hhmm(toHM(libreDesde))}–${hhmm(toHM(hasta))}</span><span class="plus" aria-label="Agendar">+</span></button>`);libreDesde=null}};
  while(t<fin){const act=cs.filter(c=>toMin(c.hora)<=t&&t<citaFin(c));
    if(!act.length){if(libreDesde===null)libreDesde=t;t+=30;continue}
    cierraLibre(t);const grp=[...act];let end=Math.max(...grp.map(citaFin));
    for(;;){const cov=cs.filter(c=>toMin(c.hora)<end&&!grp.includes(c)&&toMin(c.hora)>=t);if(!cov.length)break;cov.forEach(c=>grp.push(c));end=Math.max(end,...grp.map(citaFin))}
    out.push(grp.length>1?`<div class="slot busy multi"><span class="lbl">${grp.length} a la vez</span>${grp.sort(byHora).map(cardCita).join('')}</div>`:cardCita(grp[0]));
    t=end}
  cierraLibre(fin);
  return `<section class="tline">${out.join('')}</section>${all.length?`<details class="more"><summary>Canceladas (${all.length})</summary><div class="list">${all.map(cardCita).join('')}</div></details>`:''}`}
function atiendeOpts(fecha,cur){const g=(S.equipo||[]).filter(e=>e.activo!==false&&e.rol!=='transporte');

const MODOS={hora:['Por hora','Monto por hora (₡)','Se multiplica por las horas que marca.'],dia:['Por día','Monto por día trabajado (₡)','Cuenta los días en que marcó entrada.'],servicio:['Por servicio','Monto por cada mascota que atiende (₡)','Cuenta las citas realizadas donde ella o él atiende.'],comision:['Comisión','Porcentaje de lo cobrado (%)','Sobre el precio de las citas que atiende, sin contar el transporte.'],viaje:['Por viaje','Monto por mascota recogida y entregada (₡)','Para el chofer: cuenta las entregas terminadas.'],fijo:['Fijo','Monto fijo al mes (₡)','En la vista de quincena se cuenta la mitad.']};

function pagoEmp(e,R){const hs=(S.horas||[]).filter(h=>h.emp===e.id&&enRango(h.fecha,R)),m=hs.reduce((a,h)=>a+durMin(h),0);
  const modo=MODOS[e.pago]?e.pago:'hora',t=+(modo==='fijo'?(e.fijo||e.tarifa):e.tarifa)||0;

  let monto=0,det='';
  if(modo==='hora'){monto=Math.round(m/60*t);det=`${fmtDur(m)} × ${money(t)}`}
  else if(modo==='dia'){const d=new Set(hs.map(h=>h.fecha)).size;monto=d*t;det=`${d} día${d===1?'':'s'} × ${money(t)}`}

  authEl().hidden=true;$('.shell').hidden=false;started=true;view=tabsFor()[0];render();

  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey);

const INS_CATS=['Shampoo / acondicionador','Perfume','Algodón','Alcohol','Limpieza','Otro'];
const liquido=c=>['Shampoo / acondicionador','Perfume','Otro'].includes(c);
function insCosto(i,si){const c=+i.costo||0;if(!c)return 0;
  if(liquido(i.cat)){const ml=+i.ml||0,mez=+(i.mlTam||[])[si]||0,d=+i.dil||0;if(ml>0&&mez>0)return c*(mez/(1+d))/ml;return +i.rinde>0?c/+i.rinde:0}
  if(i.cat==='Algodón')return +i.unid>0?c/+i.unid*(+i.porBano||0):0;
  if(i.cat==='Alcohol')return +i.ml>0?c*(+i.mlBano||0)/+i.ml:0;
  return +i.rinde>0?c/+i.rinde:0}
function insRinde(i,si){if(liquido(i.cat)){const ml=+i.ml||0,mez=+(i.mlTam||[])[si]||0,d=+i.dil||0;if(ml>0&&mez>0)return Math.floor(ml/(mez/(1+d)));return +i.rinde||0}
  if(i.cat==='Algodón')return +i.porBano>0?Math.floor((+i.unid||0)/+i.porBano):0;
  if(i.cat==='Alcohol')return +i.mlBano>0?Math.floor((+i.ml||0)/+i.mlBano):0;return +i.rinde||0}
const insUsa=(i,sid)=>!i.svs||!i.svs.length||i.svs.includes(sid);
const insFalta=i=>!(+i.costo>0)||[0,1,2,3].every(si=>!insCosto(i,si));
function costoServ(sid,si){return (S.insumos||[]).filter(i=>insUsa(i,sid)).reduce((a,i)=>a+insCosto(i,si),0)+champuEst(sid,si)+(+S.negocio.luzAgua||0)}

  return await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('No se pudo preparar la foto')),'image/jpeg',.78))}finally{URL.revokeObjectURL(url)}}

  if(t.dataset.ch){const x=champuOf(t.dataset.ch);if(x){x[t.dataset.k]=t.dataset.k==='nombre'?t.value:(+t.value||0);save();chPaint(x)}return}
  if(t.dataset.hz){const c=S.citas.find(x=>x.id===t.dataset.c),h=c?.hallazgos?.find(x=>x.id===t.dataset.hz);if(h){h.txt=t.value;save()}return}
  if(t.dataset.past){const p=pastOf(t.dataset.past);if(p){p.precio=+t.value||0;save()}return}
  if(t.dataset.mv!==undefined){msgV[t.dataset.mv]=t.value;$('#panel').querySelectorAll(`[data-mv="${t.dataset.mv}"]`).forEach(x=>{if(x!==t)x.value=t.value});msgRefresh();return}
});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.name==='pastLim'){S.negocio.pastLim=t.value;save();return}
  if(t.dataset.chu){const x=champuOf(t.dataset.chu);if(x){x.usa=t.checked;save();t.closest('.ch-it')?.classList.toggle('off2',!t.checked)}return}
  if(t.dataset.chp){const x=champuOf(t.dataset.chp),h=hypOf(x?.hyp),pr=h?.p[+t.value];if(x&&pr){x.pres=+t.value;x.ml=pr[1];x.costo=pr[2];save();const c=$(`#panel input[data-ch="${x.id}"][data-k="costo"]`);if(c)c.value=pr[2];chPaint(x)}return}
  if(t.name==='pastSi'){const f=t.form,ops=f?.querySelector('#past-ops');if(ops)ops.hidden=t.value!=='si';
    if(t.value==='no'){f.querySelectorAll('input[name="pastilla"]').forEach(x=>x.checked=false);if(f.dataset.form==='fin'){const pr=$('#x-precio'),pp=+f.dataset.pp||0;if(pr)pr.value=(+pr.value||0)-pp;f.dataset.pp=0}}return}
  if(t.name==='pastilla'&&t.form?.dataset.form==='fin'){const pr=$('#x-precio'),np=t.value?(+pastOf(t.value)?.precio||0):0,pp=+t.form.dataset.pp||0;if(pr)pr.value=(+pr.value||0)+np-pp;t.form.dataset.pp=np;return}
  if(!t.dataset?.up||!t.files?.[0])return;const kind=t.dataset.up,file=t.files[0];t.value='';
  try{const p=await subirFoto(file);
    if(kind==='petcard'){const m=petOf(t.dataset.c,t.dataset.m);if(m){m.foto=p;save();openCliente(t.dataset.c)}}
    else if(kind==='petfoto'){const h=$('#p-foto');if(h)h.value=p;const box=$('#p-fotobox');if(box){box.innerHTML=fotoAvatar(p,'lg');fotosVer(box)}}
    else{const c=S.citas.find(x=>x.id===t.dataset.id);if(!c)return;
      if(kind==='res')c.fotos=[...(c.fotos||[]),p];
      if(kind==='hz'){const h=(c.hallazgos||[]).find(x=>x.id===t.dataset.h);if(h)h.foto=p}
      save();pintarFicha(c)}
    toast('Foto guardada')}catch(err){toast('No se pudo subir la foto: '+errTxt(err))}
});

/* ---------- eventos ---------- */
function arm(b){if(b.dataset.armed)return true;b.dataset.armed='1';b.dataset.orig=b.textContent;b.textContent=b.dataset.armtext||'Toca otra vez';b.classList.add('armed');setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=b.dataset.orig;b.classList.remove('armed')}},3500);return false}
function refreshClientes(){if(view==='clientes'){$('#fbar').innerHTML=filterBar();$('#clist').innerHTML=clist()}}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case 'tab':view=b.dataset.v;closeSheet();render();scrollTo(0,0);break;
    case 'day':sel=b.dataset.d;render();break;
    case 'wk':sel=addDays(sel,+b.dataset.n);render();break;
    case 'calmode':calMode=b.dataset.m;try{localStorage.setItem('cal-mode',calMode)}catch(err){}render();break;
    case 'mon':{const d=parse(sel),y=d.getFullYear(),m=d.getMonth()+(+b.dataset.n),last=new Date(y,m+1,0).getDate();sel=iso(new Date(y,m,Math.min(d.getDate(),last)));render();break}
    case 'filt':filt=b.dataset.f;refreshClientes();break;
    case 'new-cita':flow=null;openWizard();break;
    case 'new-cita-at':flow=null;openWizard({fecha:sel,hora:b.dataset.h});break;
    case 'edit-cita':openCita(id);break;
    case 'cita-pet':openWizard({c:b.dataset.c,m:b.dataset.m});break;
    case 'estado':{const c=S.citas.find(x=>x.id===id);
      if(c.estado==='pendiente'||c.estado==='cancelada'){c.estado=c.estado==='pendiente'?'confirmada':'pendiente';save();closeSheet();render();toast(`${petOf(c.cli,c.m)?.nombre||'Cita'}: ${EST[c.estado]}`)}
      else openFinish(id);break}
    case 'finish':openAviso(id);break;
    case 'cita-open':openCitaDet(id);break;
    case 'cobrado':{const c=S.citas.find(x=>x.id===id);c.pago='pagado';save();closeSheet();render();toast('Marcado como pagado');break}
    case 'cli':openCliente(id);break;
    case 'new-cli':flow=null;openClienteForm(null);break;
    case 'new-cli-flow':flow='cita';openClienteForm(null);break;
    case 'new-pet-flow':flow='cita';openPetForm($('#f-cli').value,null);break;
    case 'edit-cli':flow=null;openClienteForm(id);break;
    case 'new-pet':flow=null;openPetForm(b.dataset.c,null);break;
    case 'edit-pet':flow=null;openPetForm(b.dataset.c,b.dataset.m);break;
    case 'msg-nuevo':openNuevoMsg();break;
    case 'factura':openFactura(id);break;
    case 'trans':{const c=S.citas.find(x=>x.id===id);c.trans=b.dataset.t;save();render();toast(`${petOf(c.cli,c.m)?.nombre||'Mascota'}: ${b.dataset.t==='recogido'?'recogido, ya está en el local':'entregado en casa'}`);break}
    case 'raza':$('#p-raza').value=b.dataset.r;$('#rpick').innerHTML=razaOpts(b.dataset.r);$('#rpick').querySelector('.on')?.scrollIntoView({block:'nearest'});break;
    case 'close':closeSheet();break;
    case 'copy':{const t=document.getElementById(b.dataset.src);const done=()=>{b.textContent='Copiado ✓'};
      try{navigator.clipboard.writeText(t.value).then(done,()=>{t.select();toast('Mantenga presionado para copiar')})}catch(err){t.select();toast('Mantenga presionado para copiar')}break}
    case 'del-cita':if(arm(b)){S.citas=S.citas.filter(c=>c.id!==id);save();closeSheet();render();toast('Cita borrada')}break;
    case 'del-cli':if(arm(b)){S.clientes=S.clientes.filter(c=>c.id!==id);S.citas=S.citas.filter(c=>c.cli!==id);save();closeSheet();render();toast('Cliente borrado')}break;
    case 'del-pet':if(arm(b)){const cl=cliOf(b.dataset.c);cl.mascotas=cl.mascotas.filter(m=>m.id!==id);S.citas=S.citas.filter(c=>c.m!==id);save();render();openCliente(cl.id);toast('Mascota borrada')}break;
    case 'add-sv':S.servicios.push({id:uid(),nombre:'Nuevo servicio',p:[0,0,0,0]});save();render();break;
    case 'del-sv':S.servicios=S.servicios.filter(s=>s.id!==id);S.citas.forEach(c=>c.sv=c.sv.filter(x=>x!==id));save();render();break;
    case 'add-z':S.zonas.push({id:uid(),nombre:'Nueva zona',recargo:0});save();render();break;
    case 'del-z':S.zonas=S.zonas.filter(z=>z.id!==id);S.clientes.forEach(c=>{if(c.zona===id)c.zona=''});save();render();break;
    case 'tpl-reset':S.tpl[b.dataset.k]=TPL_DEF[b.dataset.k];save();document.getElementById('t-'+b.dataset.k).value=S.tpl[b.dataset.k];toast('Mensaje restaurado');break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){q=t.value;$('#clist').innerHTML=clist();return}
  if(t.id==='p-raza'){$('#rpick').innerHTML=razaOpts(t.value);$('#rpick').scrollTop=0;return}
  if(t.id==='w-msg'){const l=$('#w-link'),c=S.citas.find(x=>x.id===$('#w-link')?.dataset.c);if(l){const tel=l.getAttribute('href').match(/wa\.me\/(\d+)/)[1];l.href=`https://wa.me/${tel}?text=${encodeURIComponent(t.value)}`}return}
  if(t.dataset.n){S.negocio[t.dataset.n]=t.value;save();$('#bizName').textContent=S.negocio.nombre||'Estética canina';$('#bizSub').textContent=[S.negocio.lema,S.negocio.tel&&'WhatsApp '+S.negocio.tel,S.negocio.ig].filter(Boolean).join(' · ');return}
  if(t.dataset.sv){const s=servOf(t.dataset.sv);if(t.dataset.k==='n')s.nombre=t.value;else if(t.dataset.k==='min')s.min=+t.value||0;else s.p[+t.dataset.k]=+t.value||0;save();return}
  if(t.dataset.z){const z=zonaOf(t.dataset.z);if(t.dataset.k==='n')z.nombre=t.value;else z.recargo=+t.value||0;save();return}
  if(t.dataset.t){S.tpl[t.dataset.t]=t.value;save();return}
  if(t.id==='c-ced'){const n=$('#fe-num');if(n&&(!n.value||n.dataset.auto)){n.value=onlyDig(t.value);n.dataset.auto='1';feCheck()}return}
  if(t.id==='fe-num'){delete t.dataset.auto;feCheck()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='fe-on'){feCheck();return}
  if(e.target.id==='fe-tipo'){feCheck();return}
  if(e.target.dataset.n){S.negocio[e.target.dataset.n]=e.target.value;save();return}
  const f=e.target.closest('form[data-form="cita"]');if(!f)return;const n=e.target.name;
  if(n==='cli')$('#f-m').innerHTML=petOpts(e.target.value,'');
  if(n==='fecha'){$('#f-hora').innerHTML=slots(e.target.value,$('#f-hora').value,f.dataset.id);if($('#f-atiende'))$('#f-atiende').innerHTML=atiendeOpts(e.target.value,$('#f-atiende').value)}
  if(['cli','m','sv','tipo','transP'].includes(n))recalc(true);
});
document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();const fd=new FormData(f),id=f.dataset.id;
  if(f.dataset.form==='cita'){
    const c=readCita(f);if(!c.m){toast('Elija o agregue una mascota');return}
    let cid=id;
    if(id)Object.assign(S.citas.find(x=>x.id===id),c);else{cid=uid();S.citas.push({id:cid,pago:'pendiente',metodo:'',salud:[],tutor:'',trans:'recoger',...c})}
    sel=c.fecha;save();if(view==='ajustes'||view==='clientes')view='agenda';render();
    if(c.estado==='realizada'&&!(id&&S.citas.find(x=>x.id===id).salud?.length))openFinish(cid);else{closeSheet();toast('Cita guardada')}
  }
  if(f.dataset.form==='fin'){
    const c=S.citas.find(x=>x.id===id);
    Object.assign(c,{estado:'realizada',precio:+fd.get('precio')||0,pago:fd.get('pago'),metodo:fd.get('metodo')||'',salud:fd.getAll('salud'),tutor:(fd.get('tutor')||'').trim(),fact:fd.get('fact')||'no',factNum:(fd.get('factNum')||'').trim()});
    readFicha(fd,c);save();render();openAviso(id);
  }
  if(f.dataset.form==='fact'){
    const c=S.citas.find(x=>x.id===id);c.fact=fd.get('fact')||'pendiente';c.factNum=(fd.get('factNum')||'').trim();
    save();render();closeSheet();toast(c.fact==='emitida'?'Factura marcada como emitida':'Factura guardada');
  }
  if(f.dataset.form==='cli'){
    const d={nombre:fd.get('nombre').trim(),tel:fd.get('tel').trim(),tel2:(fd.get('tel2')||'').trim(),ced:onlyDig(fd.get('ced'))||(fd.get('ced')||'').trim(),dir:fd.get('dir').trim(),zona:fd.get('zona'),ubic:fd.get('ubic').trim(),senas:fd.get('senas').trim(),
      fe:{on:fd.has('feOn'),nombre:(fd.get('feNombre')||'').trim(),tipo:fd.get('feTipo')||'fisica',num:onlyDig(fd.get('feNum'))||(fd.get('feNum')||'').trim(),correo:(fd.get('feCorreo')||'').trim(),actividad:(fd.get('feAct')||'').trim(),prov:fd.get('feProv')||'',canton:(fd.get('feCanton')||'').trim(),distrito:(fd.get('feDist')||'').trim()}};
    if(!d.fe.num&&d.ced)d.fe.num=d.ced;
    if(d.fe.on){const p=idProblem(d.fe.tipo,d.fe.num);if(p&&onlyDig(d.fe.num)){toast(p);$('#fe-num').focus();return}if(d.fe.correo&&!mailOk(d.fe.correo)){toast('Revise el correo de la factura');$('#fe-correo').focus();return}}
    let cid=id;if(id)Object.assign(cliOf(id),d);else{cid=uid();S.clientes.push({id:cid,...d,mascotas:[]})}
    save();render();
    if(!id&&flow==='cita')openPetForm(cid,null);else{flow=null;openCliente(cid)}
    toast('Cliente guardado');
  }
  if(f.dataset.form==='pet'){
    const cid=f.dataset.c,cl=cliOf(cid);
    const d={nombre:fd.get('nombre').trim(),raza:fd.get('raza').trim(),especie:fd.get('especie')||'Perro',sexo:fd.get('sexo')||'Macho',tam:fd.get('tam')||'M',etapa:fd.get('etapa')||'Adulto',temp:fd.get('temp')||'Tranquilo',comp:fd.get('comp')||'promedio',muerde:fd.has('muerde'),castrado:fd.has('castrado'),frec:+fd.get('frec')||30,notas:fd.get('notas').trim(),foto:fd.get('foto')||''};
    let mid=id;if(id)Object.assign(petOf(cid,id),d);else{mid=uid();cl.mascotas.push({id:mid,...d})}
    save();render();
    if(flow==='cita'){flow=null;openWizard({c:cid,m:mid})}else openCliente(cid);
    toast('Mascota guardada');
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
boot();
</script>
